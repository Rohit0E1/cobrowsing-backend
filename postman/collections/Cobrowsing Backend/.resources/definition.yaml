$kind: collection
name: Cobrowsing Backend
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
variables:
  - key: token
    value: ''
    description: JWT token — populated automatically by the Login request
  - key: baseUrl
    value: 'http://localhost:5001/api/v1'
    description: Base URL for the Cobrowsing Backend API
